services:
  postgres:
    image: postgres:16-alpine
    container_name: pitzaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitzaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitzaa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pitzaa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pitzaa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitzaa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: pitzaa-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitzaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitzaa_dev_password}
      POSTGRES_DB: pitzaa_test
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitzaa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pitzaa-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pitzaa_postgres_data:
