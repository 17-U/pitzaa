# Déploiement sur le VPS : API + Postgres + Redis + Caddy (TLS automatique).
# Postgres/Redis ne publient aucun port sur l'hôte — seuls Caddy (80/443) est exposé.
# Utilisation : docker compose -f docker-compose.prod.yml --env-file .env up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: pitzaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pitzaa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pitzaa-redis
    restart: unless-stopped
    volumes:
      - pitzaa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pitzaa-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: pitzaa-caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - pitzaa_caddy_data:/data
      - pitzaa_caddy_config:/config
    depends_on:
      - api

volumes:
  pitzaa_postgres_data:
  pitzaa_redis_data:
  pitzaa_caddy_data:
  pitzaa_caddy_config:
